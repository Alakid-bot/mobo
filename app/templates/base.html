<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}mobo 管理台{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-csrf="{{ csrf_token }}">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="回到总览">
        <span class="brand-mark">mo</span>
        <span><strong>mobo</strong><small>CONTROL ROOM</small></span>
      </a>
      <nav aria-label="主导航">
        <a href="/" class="nav-item {{ 'active' if page == 'dashboard' else '' }}"><span>总览</span><em>01</em></a>
        <a href="/settings" class="nav-item {{ 'active' if page == 'settings' else '' }}"><span>全部配置</span><em>02</em></a>
        <a href="/models" class="nav-item {{ 'active' if page == 'models' else '' }}"><span>模型中心</span><em>03</em></a>
        <a href="/behavior" class="nav-item {{ 'active' if page == 'behavior' else '' }}"><span>性格与行为</span><em>04</em></a>
        <a href="/memories" class="nav-item {{ 'active' if page == 'memories' else '' }}"><span>记忆库</span><em>05</em></a>
        <a href="/audit" class="nav-item {{ 'active' if page == 'audit' else '' }}"><span>审计记录</span><em>06</em></a>
        <a href="/security" class="nav-item {{ 'active' if page == 'security' else '' }}"><span>安全与权限</span><em>07</em></a>
      </nav>
      <div class="sidebar-foot">
        <button class="connection-card" type="button" data-refresh-bot-identity aria-label="刷新 Discord Bot 身份并同步服务器外观" title="从 Discord 刷新 Bot 身份，并同步所有已安装服务器">
          <span class="bot-avatar-shell">
            <img data-bot-avatar src="/api/discord/identity/avatar?v={{ bot_status.avatar_version }}" alt="{{ bot_status.display_name }} 的头像" {{ 'hidden' if not bot_status.avatar_available else '' }}>
            <span data-bot-avatar-fallback {{ 'hidden' if bot_status.avatar_available else '' }}>mo</span>
            <i class="pulse {{ 'online' if bot_status.ready else '' }}"></i>
          </span>
          <span class="connection-copy"><strong data-bot-display-name>{{ bot_status.display_name if bot_status.ready else 'Discord 启动中' }}</strong><small data-bot-tag>{{ bot_status.user_tag }}</small></span>
          <span class="sync-glyph" aria-hidden="true">↻</span>
        </button>
        <form action="/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="text-button" type="submit">退出管理台</button>
        </form>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="menu-button" type="button" data-menu-toggle aria-label="打开导航">菜单</button>
        <div class="crumb">mobo <span>/</span> {% block crumb %}总览{% endblock %}</div>
        <div class="topbar-meta"><span>{{ session.username }}</span><span class="secure-dot">加密会话</span></div>
      </header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <div class="toast" role="status" aria-live="polite" data-toast></div>
</body>
</html>
